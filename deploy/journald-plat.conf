# plat — retenção do log (item L7-06-c). Instalado pelo install.sh em
# /etc/systemd/journald.conf.d/plat.conf; passa a valer no próximo `systemctl restart systemd-journald`.
#
# O alvo é o mesmo do `maxLogFileAge` padrão do ArcGIS Server: 90 dias. Duas coisas têm de ficar claras,
# porque medir aqui mudou a resposta:
#
# 1. O journald NÃO tem teto por unidade. `SystemMaxUse` e `MaxRetentionSec` valem para o journal INTEIRO
#    da máquina, que é compartilhado com todos os outros serviços dela. Teto por serviço só existe com
#    journal separado (`LogNamespace=plat` nas unidades plat-*, com um
#    /etc/systemd/journald@plat.conf próprio) — o que obriga a reiniciar as unidades e muda a leitura
#    para `journalctl --namespace=plat`. Está descrito em docs/adr/20260907T1845-log-consulta-por-req-id.md
#    e NÃO foi feito aqui.
# 2. `MaxRetentionSec=90d` APAGA o que passa de 90 dias; não promete que 90 dias caibam. Medido em
#    07/09/2026 nesta máquina: o journal ocupava 2,34 GB e guardava 2,9 dias — cerca de 780 MB/dia de
#    todo o servidor, o que daria ~70 GB para 90 dias, com o disco a 96%. As unidades da plataforma
#    respondem por pouco disso: plat-api 391 KB/dia, plat-worker 130 KB/dia, plat-martin 302 KB/dia,
#    nginx 11 KB/dia e Postgres 20 KB/dia — 0,83 MB/dia somados, ou ~75 MB em 90 dias.
#    Ou seja: o horizonte de 90 dias do log DA PLATAFORMA é barato; quem não cabe é o resto da máquina.
[Journal]
MaxRetentionSec=90d
# Teto de espaço: escolha do operador. O padrão do journald é 10% do sistema de arquivos.
# SystemMaxUse=8G
