# item L7-06-a-metricas-exporters: status interno do nginx para o prometheus-nginx-exporter.
# 127.0.0.1 apenas (nunca exposto por HTTPS/domínio público); server_name "_" para não interferir
# em nenhum outro vhost — arquivo próprio, nunca editar plat.iagrointel.com nem os das outras frentes.
server {
    listen 127.0.0.1:8096;
    server_name _;
    access_log off;
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
    location / {
        return 404;
    }
}
