# Consultas próprias do postgres_exporter (item L7-06-a-metricas-exporters). Contrato de cardinalidade
# igual ao de app/metricas.py: rótulo por inquilino é SEMPRE tenant_id (plat.tenant.id, inteiro opaco),
# NUNCA o slug (schema d_<slug> pode carregar o nome do cliente) nem qualquer texto livre. Reaplicar com
# `systemctl restart prometheus-postgres-exporter` depois de editar (o exporter só lê no início).

plat_tenant_schema:
  query: |
    SELECT t.id::text AS tenant_id,
           sum(pg_total_relation_size(c.oid))::bigint AS bytes
    FROM pg_class c
    JOIN pg_namespace n ON n.oid = c.relnamespace
    JOIN plat.tenant t ON n.nspname = 'd_' || t.slug
    WHERE c.relkind IN ('r', 'm')
    GROUP BY t.id
  metrics:
    - tenant_id:
        usage: "LABEL"
        description: "plat.tenant.id (nunca o slug/schema)"
    - bytes:
        usage: "GAUGE"
        description: "soma de pg_total_relation_size das tabelas do schema de dado do inquilino"

plat_tenant_conexoes:
  query: |
    SELECT split_part(application_name, ':', 2) AS tenant_id,
           count(*) AS conexoes
    FROM pg_stat_activity
    WHERE datname = current_database() AND application_name LIKE 'plat:%'
    GROUP BY 1
  metrics:
    - tenant_id:
        usage: "LABEL"
        description: "plat.tenant.id lido de application_name='plat:<id>' (app/db.py::_preparar)"
    - conexoes:
        usage: "GAUGE"
        description: "conexões abertas AGORA com contexto deste inquilino"

# ------------------------------------------------------------------ item L7-06-d-paineis
# Três famílias LIMITADAS por LIMIT, escritas para o painel "Banco" e o painel "Objetos". O motivo do
# LIMIT é o mesmo achado do L7-06-a: os coletores padrão stat_user_tables/statio_user_tables foram
# desligados porque devolviam 231.807 séries (o iagro_sat é compartilhado por dezenas de frentes da
# casa). Estas três varrem SÓ o schema da plataforma e devolvem no máximo 10 + 5 + (nº de inquilinos)
# séries.

plat_tabela_maior:
  query: |
    SELECT c.relname::text AS tabela,
           pg_total_relation_size(c.oid)::bigint AS bytes
    FROM pg_class c
    JOIN pg_namespace n ON n.oid = c.relnamespace
    WHERE n.nspname = 'plat' AND c.relkind IN ('r', 'm', 'p')
    ORDER BY 2 DESC
    LIMIT 10
  metrics:
    - tabela:
        usage: "LABEL"
        description: "nome da tabela no schema da plataforma (nunca schema de dado d_<slug>)"
    - bytes:
        usage: "GAUGE"
        description: "pg_total_relation_size das 10 maiores tabelas do schema plat"

# ⚠️ NÃO existe aqui uma consulta `plat_consulta_lenta` sobre pg_stat_statements, e não é esquecimento:
# medido em 07/09/2026 neste cluster, `shared_preload_libraries = timescaledb,pg_cron,pgaudit` — a
# extensão está instalada mas NÃO pré-carregada, então toda leitura da view devolve "pg_stat_statements
# must be loaded via shared_preload_libraries" e o scrape inteiro falha por causa dela. Ligar exige
# reiniciar um cluster compartilhado por dezenas de frentes da casa; é decisão do dono, não deste item.
# O painel "Banco" responde à mesma pergunta pela via que existe: pg_stat_activity (transação mais
# longa agora). Quando o pré-carregamento entrar, esta é a consulta a acrescentar:
#   SELECT s.queryid::text AS consulta, (s.mean_exec_time/1000.0)::float8 AS media_segundos,
#          s.calls::bigint AS chamadas
#   FROM pg_stat_statements s JOIN pg_database d ON d.oid = s.dbid
#   WHERE d.datname = current_database() AND s.calls > 10 ORDER BY s.mean_exec_time DESC LIMIT 5
# (rótulo é o queryid; o TEXTO da consulta nunca vira métrica, pode carregar literal do cliente)
#
# `plat_bucket_*` também NÃO está aqui: plat.arquivo_bucket e plat.arquivo têm RLS por inquilino e o
# papel de métrica não tem BYPASSRLS — a consulta direta devolve zero linha (medido). O uso por
# inquilino sai da API, por função SECURITY DEFINER (plat.arquivo_bucket_uso, app/metricas.py).
