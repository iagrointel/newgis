# Drop-in para a unidade plataforma-garage (item L7-19, achado 18 do adversário no turno 3: rpc_secret e
# admin_token em claro em /home/dev/plataforma/pipeline/garage/garage.toml, arquivo 0600 do usuário `dev` —
# e todo processo desta máquina roda como `dev`, então o modo 0600 não protege de nada).
#
# Instalar em /etc/systemd/system/plataforma-garage.service.d/segredos.conf. Passo do DONO: exige
# `systemctl daemon-reload` e `systemctl restart plataforma-garage` (derruba o S3 por alguns segundos).
# Procedimento completo, com a ordem e o como voltar atrás, em docs/AMBIENTES.md seção 5.
#
# O Garage v2.3.0 aceita os três segredos por ARQUIVO, em lugar do garage.toml (`garage --help`:
# --rpc-secret-file / --admin-token-file / --metrics-token-file, com as variáveis de ambiente
# GARAGE_RPC_SECRET_FILE / GARAGE_ADMIN_TOKEN_FILE / GARAGE_METRICS_TOKEN_FILE). MEDIDO nesta máquina:
# `GARAGE_RPC_SECRET_FILE=<arquivo> garage -c <garage.toml SEM a linha rpc_secret> status` fala com o
# daemon vivo e devolve o nó saudável — a forma por arquivo funciona neste binário.
#
# %d é o diretório de credenciais que o systemd monta para esta unidade (tmpfs, uma cópia por unidade).
[Service]
LoadCredential=rpc_secret:/etc/plat/segredos-garage/rpc_secret
LoadCredential=admin_token:/etc/plat/segredos-garage/admin_token
Environment=GARAGE_RPC_SECRET_FILE=%d/rpc_secret
Environment=GARAGE_ADMIN_TOKEN_FILE=%d/admin_token
