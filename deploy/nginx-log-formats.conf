# Formatos de log em contexto http (item L7-06-a-metricas-exporters): nginx só aceita `log_format` fora
# de um bloco `server`, por isso este arquivo vive em /etc/nginx/conf.d/ (padrão já usado na casa para
# outros formatos, ex. cpsi-track.conf) e NÃO dentro de deploy/nginx.conf (que é o corpo de UM server{}).
# Instalação: copiar para /etc/nginx/conf.d/plat_log_formats.conf e `nginx -t && systemctl reload nginx`
# (install.sh faz isso no passo de nginx quando o arquivo ainda não existe — nunca sobrescreve o que já
# está lá, para não colidir com log_format de outra frente).
#
# $request_id (variável nativa do nginx, hex aleatório por requisição) é o valor que a location /tiles/
# de deploy/nginx.conf manda a montante no cabeçalho X-Req-Id — logar $request_id aqui É logar o que
# chegou ao Martin, mesmo que o PRÓPRIO Martin não tenha como registrar cabeçalho arbitrário no dele.
log_format plat_tiles '$remote_addr - [$time_iso8601] "$request_method $plat_uri_redigido $server_protocol" $status $body_bytes_sent '
                       'req_id=$request_id rt=$request_time uct=$upstream_connect_time '
                       'uht=$upstream_header_time urt=$upstream_response_time';

# 18/09/2026 — OS DOIS BLOCOS CONVIVEM, e a ordem importa: o `map $plat_uri_redigido` do bloco de
# L7-06-c e usado pelos DOIS formatos, entao vem primeiro. O `plat_json_cache` de L1-02-d nao
# substitui o `plat_json`: e formato de nome proprio justamente para nao mudar o log de quem divide
# este arquivo em /etc/nginx/conf.d/.

# ---------------------------------------------------------------- item L7-06-c-logs-consulta-req-id
# 1) REDAÇÃO DO TOKEN. O token de serviço dos ladrilhos vive no CAMINHO da URL
#    (`/svc/<token>/raster|mosaico|...`, app/tiles/autorizacao.py), então logar `$request` cru põe o
#    token inteiro, em texto claro, no access log. O `map` abaixo troca o segmento do token por
#    `<token>` antes de qualquer gravação. `$request` NÃO aparece mais em log_format nenhum deste
#    arquivo: o que se loga é o método, o caminho redigido e o protocolo, separados.
map $uri $plat_uri_redigido {
    default                                    $uri;
    "~^/svc/[A-Za-z0-9_-]+/(?<plat_resto>.*)$" "/svc/<token>/$plat_resto";
}

# 2) FONTE `nginx` DE `plat logs --req-id`. app/logs_consulta.py::FONTES_PADRAO lê a linha do nginx
#    por `journalctl -t plat_nginx`; sem uma tag de journal escrita aqui a fonte fica vazia para
#    sempre. O formato é JSON de uma linha, com o MESMO `req_id` que a location /tiles/ de
#    deploy/nginx.conf manda a montante no cabeçalho X-Req-Id — é isso que faz as linhas do nginx e
#    as da API casarem em `plat logs --req-id`.
log_format plat_json escape=json '{"ts":"$time_iso8601","fonte":"nginx","ip":"$remote_addr",'
                                 '"metodo":"$request_method","rota":"$plat_uri_redigido",'
                                 '"protocolo":"$server_protocol","status":$status,'
                                 '"bytes":$body_bytes_sent,"req_id":"$request_id",'
                                 '"rt":$request_time,"agente":"$http_user_agent"}';
# ---------------------------------------------------------------- item L1-02-d: taxa de acerto do cache
# `$upstream_cache_status` é a ÚNICA fonte possível desse número. O cache de ladrilho fica no nginx,
# ANTES da aplicação: um HIT nunca chega ao processo Python, então a aplicação sozinha concluiria que a
# taxa de acerto é zero. O valor é HIT, MISS, EXPIRED, STALE, UPDATING, REVALIDATED ou BYPASS; fica
# vazio (`-`) quando a requisição não passou por zona de cache nenhuma, e `app/imagens/cache_status.py`
# conta essa linha como `sem_cache`, nunca como falta de acerto.
#
# Este formato ACRESCENTA um campo ao `plat_json` já usado pela fonte `nginx` de `plat logs --req-id`.
# É um formato NOVO, de nome próprio, de propósito: trocar o `plat_json` no lugar mudaria o log de
# outras frentes que dividem este mesmo arquivo em /etc/nginx/conf.d/. Para ligar, use-o no
# `access_log` da location dos ladrilhos:
#     access_log syslog:server=unix:/dev/log,tag=plat_nginx plat_json_cache;
log_format plat_json_cache escape=json '{"ts":"$time_iso8601","fonte":"nginx","ip":"$remote_addr",'
                                       '"metodo":"$request_method","rota":"$plat_uri_redigido",'
                                       '"protocolo":"$server_protocol","status":$status,'
                                       '"bytes":$body_bytes_sent,"req_id":"$request_id",'
                                       '"rt":$request_time,"agente":"$http_user_agent",'
                                       '"cache":"$upstream_cache_status"}';
