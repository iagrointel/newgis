# Config do Martin (item L2-01-b-martin-tiles-vetoriais). `${PLAT_DSN_LEITOR}` é interpolado pelo próprio
# Martin a partir do ambiente do processo — o systemd (LoadCredential, deploy/plat-martin.service) entrega o
# DSN do papel `plat_leitor` (LOGIN, sem BYPASSRLS, sem dono de nada; db/leitor_instalar.sh). NENHUM segredo
# neste arquivo.
#
# auto_publish.tables: false + functions (default true quando o outro está desligado) publica SÓ as funções
# de tile — nunca a tabela crua da camada. Isso importa porque a tabela crua, se publicada como "table
# source", devolveria linhas sem NUNCA passar por plat.contexto_por_token (a validação de token e o
# set_config do inquilino ficam DENTRO da função de tile, não numa policy que o Martin veja de fora). A RLS
# do papel de leitura (`p_c_<curto>_leitor`, migração 20260906T1546_leitor_tiles) ainda barra o acesso direto
# à tabela — sem prova, plat.tenant_leitor() é NULL e a política não bate em nenhuma linha —, mas só a rota
# de FUNÇÃO faz o pedido sem token falhar de forma nomeada (token_ausente) em vez de devolver silenciosamente
# um tile vazio. from_schemas vazio = todos os schemas: novos inquilinos (schema d_<slug> novo) entram sem
# reeditar este arquivo, e o reload_interval below repete a descoberta sem reiniciar o processo.
listen_addresses: '127.0.0.1:8151'
worker_processes: 2
postgres:
  connection_string: ${PLAT_DSN_LEITOR}
  auto_publish:
    tables: false
  pool_size: 10
  # 10.000 feições por tile (portão do item): acima disso o Martin corta e o tile fica "cut off" em vez de
  # estourar latência. A marcação explícita de "truncado" no corpo do tile é feita pela própria função SQL
  # (plat.camada_tile_garantir, coluna _truncado quando o corte ocorre), não por este limite sozinho.
  max_feature_count: 10000
  default_srid: 4326
# cache em memória do próprio processo (não é o nginx): a chave inclui a query string de cada pedido
# (fonte + z/x/y + query_params, que carrega o token) — dois inquilinos ou dois tokens diferentes nunca
# colidem no mesmo slot de cache (martin-core/src/tiles/cache.rs, TileCacheKey::Dynamic; conferido no
# código-fonte da tag martin-v1.15.0 antes de habilitar isto). 64 MB é suficiente para a demonstração; em
# produção com 8,4 mi de feições ajustar por medição, nunca por achismo.
cache:
  size_mb: 64
  expiry: 5m
