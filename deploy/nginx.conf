# plat — plataforma SIG em pilha aberta (FastAPI :PORTA). Interno. Análise / beta privado.
# Gerado pelo install.sh a partir de deploy/nginx.conf; as linhas "# managed by Certbot" são preservadas.
# Cache-Control tem UMA origem só (decisão T2): a APLICAÇÃO nas rotas proxiadas, o NGINX no /static/ (onde o nginx
# é a origem do corpo). Motivo: `add_header` do nginx ACRESCENTA, nunca substitui — com a linha aqui, toda resposta
# que a aplicação já declarava saía com dois Cache-Control (MEDIDO em /saude e /tarefas: "no-store" + "no-store,
# must-revalidate"), e uma resposta que precisa de cache (miniatura: `private, max-age=300`) sairia contradita, sem
# como o serviço opor-se. A aplicação garante o piso `no-store, must-revalidate` em toda resposta pelo middleware
# de app/auth/middleware.py; quem quiser outro valor declara na própria rota.
server {
    server_name DOMINIO;
    client_max_body_size 200m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS só faz sentido no bloco 443: o install.sh apaga estas linhas quando ainda não há certificado
    add_header Strict-Transport-Security "max-age=31536000" always;

    # PMTiles (item L2-01-a): o navegador lê por Range HTTP (206) para não baixar o arquivo inteiro por
    # tile; `gzip off` é obrigatório aqui — nginx não manda Range em corpo comprimido on-the-fly, e o
    # PMTiles já vem com compressão interna por tile (regra já paga na casa, DOC.md/L2_CONCEITO C3).
    # Regex com captura (obrigatório com `alias`: sem grupo, TODA requisição que bate cai no mesmo
    # arquivo — armadilha clássica do nginx); casa antes do prefixo `/static/` genérico logo abaixo (a
    # regex vence um prefixo simples sem `^~`, regra de precedência do nginx).
    location ~* ^/static/dados/basemap/(?<arquivo_pmtiles>[^/]+\.pmtiles)$ {
        alias APP_DIR/web/dados/basemap/$arquivo_pmtiles;
        gzip off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # estático direto do disco; no-store nos módulos ES (nunca ?v= em import: duas URLs = duas instâncias)
    location /static/ {
        alias APP_DIR/web/;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # tiles vetoriais (itens L2-01-mapa-web / L2-01-b): dois caminhos possíveis, um contrato de URL só.
    # O que está ligado por padrão é o repasse pela própria plataforma (location / abaixo, rota
    # /tiles/... de app/mapa/rotas.py), porque é o caminho que a suíte prova de ponta a ponta e o que
    # funciona no appliance sem nginx. Para tirar o Python do caminho do tile sob carga, troque o
    # comentário abaixo: o nginx valida o token com auth_request em /internal/tiles/verificar (a MESMA
    # função de autorização, app/tiles/rotas.autorizar) e repassa direto ao Martin em 127.0.0.1:8151.
    #
    # location /tiles/ {
    #     auth_request /internal/tiles/verificar;
    #     auth_request_set $motivo $upstream_http_x_motivo_recusa;
    #     proxy_pass http://127.0.0.1:8151/;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
    # location = /internal/tiles/verificar {
    #     internal;
    #     proxy_pass http://127.0.0.1:PORTA;
    #     proxy_pass_request_body off;
    #     proxy_set_header Content-Length "";
    #     proxy_set_header X-Original-Uri $request_uri;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # login: 10 r/min por IP (burst 10, sem atraso) contra força bruta por IP; 429 é a resposta (ADR 0002 seção 6.2).
    # add_header dentro do bloco cancela os herdados: o conjunto inteiro é repetido (armadilha documentada do nginx)
    location = /api/login {
        limit_req zone=plat_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /api/login/2fa {
        limit_req zone=plat_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # ---------------------------------------------------- tiles vetoriais, 3 contratos (item L2-04-e)
    # Contrato 1 (TileJSON/XYZ, MapLibre/QGIS): token no CAMINHO, cache SEM o token na chave (mesma
    # decisão do ladrilho raster, item L1-02: dois tokens válidos do mesmo item batem no mesmo tile em
    # disco). `auth_request` roda em cada pedido, cache ou não — é ele que faz "token revogado = 401"
    # valer mesmo com o tile já em disco (2 s de cache próprio; pior caso de revogação = 2 s).
    location ~ ^/tiles/(?<plat_tok>[^/]+)/(?<plat_item>[0-9a-fA-F-]+)/(?<plat_resto>[0-9]+/[0-9]+/[0-9]+\.pbf)$ {
        auth_request /_plat_tile_vetor_autorizar;
        proxy_cache plat_tiles_vetor;
        proxy_cache_key "$plat_item|$plat_resto";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 20s;
        proxy_cache_valid 200 204 5m;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        add_header X-Plat-Cache $upstream_cache_status always;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # Contrato 2 (VectorTileServer Esri), só o TILE (ordem z/y/x) — o mesmo tratamento de cache do
    # contrato 1; TileJSON/descritor/estilo/sprites/fontes/exportação caem no bloco geral "/" logo
    # abaixo (documentos pequenos, sem ganho de cache de disco; Cache-Control vem da aplicação).
    location ~ ^/svc/(?<plat_tok>[^/]+)/rest/services/(?<plat_item>[0-9a-fA-F-]+)/VectorTileServer/tile/(?<plat_resto>[0-9]+/[0-9]+/[0-9]+\.pbf)$ {
        auth_request /_plat_tile_vetor_autorizar;
        proxy_cache plat_tiles_vetor;
        proxy_cache_key "$plat_item|$plat_resto|esri";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 20s;
        proxy_cache_valid 200 204 5m;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        add_header X-Plat-Cache $upstream_cache_status always;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /_plat_tile_vetor_autorizar {
        internal;
        proxy_pass http://127.0.0.1:PORTA/api/tiles/vetor/autorizar;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Plat-Token $plat_tok;
        proxy_set_header X-Plat-Item $plat_item;
        proxy_set_header X-Real-IP $remote_addr;
        # a aplicação põe `no-store` em TODA resposta (piso do middleware, ADR 0002 seção 5): sem
        # ignorar esse cabeçalho aqui, o nginx nunca guardaria a autorização e cada tile bateria na
        # aplicação de novo (mesmo achado, medido, do ladrilho raster: 425 tiles/s indo à aplicação
        # contra 12.751 com a autorização em cache).
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache plat_tiles_vetor_auth;
        proxy_cache_key "$plat_tok|$plat_item|$http_referer|$http_origin|$remote_addr";
        proxy_cache_valid 204 401 403 2s;
        proxy_cache_lock on;
    }

    location / {
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
