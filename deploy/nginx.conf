# plat — plataforma SIG em pilha aberta (FastAPI :PORTA). Interno. Análise / beta privado.
# Gerado pelo install.sh a partir de deploy/nginx.conf; as linhas "# managed by Certbot" são preservadas.
# Cache-Control tem UMA origem só (decisão T2): a APLICAÇÃO nas rotas proxiadas, o NGINX no /static/ (onde o nginx
# é a origem do corpo). Motivo: `add_header` do nginx ACRESCENTA, nunca substitui — com a linha aqui, toda resposta
# que a aplicação já declarava saía com dois Cache-Control (MEDIDO em /saude e /tarefas: "no-store" + "no-store,
# must-revalidate"), e uma resposta que precisa de cache (miniatura: `private, max-age=300`) sairia contradita, sem
# como o serviço opor-se. A aplicação garante o piso `no-store, must-revalidate` em toda resposta pelo middleware
# de app/auth/middleware.py; quem quiser outro valor declara na própria rota.
server {
    server_name DOMINIO;
    client_max_body_size 200m;
    # log próprio (formato combined padrão do nginx, $remote_addr — nunca $http_x_forwarded_for, então imune
    # a cabeçalho forjado) — camada 3 do item L7-03-b-rate-limit-abuso: deploy/fail2ban/filter.d/plat-abuso.conf
    # lê SÓ este arquivo, nunca o access.log genérico compartilhado com outro produto da casa (docs/SEGURANCA.md §9.2)
    access_log /var/log/nginx/plat_access.log;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS só faz sentido no bloco 443: o install.sh apaga estas linhas quando ainda não há certificado
    add_header Strict-Transport-Security "max-age=31536000" always;

    # PMTiles (item L2-01-a): o navegador lê por Range HTTP (206) para não baixar o arquivo inteiro por
    # tile; `gzip off` é obrigatório aqui — nginx não manda Range em corpo comprimido on-the-fly, e o
    # PMTiles já vem com compressão interna por tile (regra já paga na casa, DOC.md/L2_CONCEITO C3).
    # Regex com captura (obrigatório com `alias`: sem grupo, TODA requisição que bate cai no mesmo
    # arquivo — armadilha clássica do nginx); casa antes do prefixo `/static/` genérico logo abaixo (a
    # regex vence um prefixo simples sem `^~`, regra de precedência do nginx).
    location ~* ^/static/dados/basemap/(?<arquivo_pmtiles>[^/]+\.pmtiles)$ {
        alias APP_DIR/web/dados/basemap/$arquivo_pmtiles;
        gzip off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # estático direto do disco; no-store nos módulos ES (nunca ?v= em import: duas URLs = duas instâncias)
    location /static/ {
        alias APP_DIR/web/;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # login: 10 r/min por IP (burst 10, sem atraso) contra força bruta por IP; 429 é a resposta (ADR 0002 seção 6.2).
    # add_header dentro do bloco cancela os herdados: o conjunto inteiro é repetido (armadilha documentada do nginx)
    location = /api/login {
        limit_req zone=plat_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /api/login/2fa {
        limit_req zone=plat_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # camada 1 do item L7-03-b-rate-limit-abuso (docs/SEGURANCA.md §9): por IP, ANTES de qualquer autenticação
    # ou consulta ao banco — pára o volume bruto na borda. burst folgado (bem acima do limite por MINUTO da
    # zona, convertido em rajada de alguns segundos) porque uma sessão de mapa normal dispara várias chamadas
    # de uma vez (abrir uma tela = N requisições quase simultâneas); quem estoura o burst já não é uso normal.
    # A camada 2 (por inquilino/plano, dentro da aplicação) é o teto fino; esta é só a rede grossa da borda.
    location /api/ {
        limit_req zone=plat_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # ladrilho (L1-02-tiles-token, ainda não mesclado nesta trilha — ver ADR desta trilha §5): a zona já entra
    # aqui para que a fiação exista no dia da junção; burst maior porque uma tela de mapa pede dezenas de
    # ladrilhos de uma vez. `limit_req` roda ANTES de qualquer `proxy_cache` que a rota venha a declarar — a
    # rajada acima do limite nunca chega ao proxy_pass, então nunca invalida nem escreve no cache (docs/
    # SEGURANCA.md §9.3 mede isso com um backend real desta mesma trilha).
    location /tiles/ {
        limit_req zone=plat_tiles burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location / {
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
