# plat — plataforma SIG em pilha aberta (FastAPI :PORTA). Interno. Análise / beta privado.
# Gerado pelo install.sh a partir de deploy/nginx.conf; as linhas "# managed by Certbot" são preservadas.
# Cache-Control tem UMA origem só (decisão T2): a APLICAÇÃO nas rotas proxiadas, o NGINX no /static/ (onde o nginx
# é a origem do corpo). Motivo: `add_header` do nginx ACRESCENTA, nunca substitui — com a linha aqui, toda resposta
# que a aplicação já declarava saía com dois Cache-Control (MEDIDO em /saude e /tarefas: "no-store" + "no-store,
# must-revalidate"), e uma resposta que precisa de cache (miniatura: `private, max-age=300`) sairia contradita, sem
# como o serviço opor-se. A aplicação garante o piso `no-store, must-revalidate` em toda resposta pelo middleware
# de app/auth/middleware.py; quem quiser outro valor declara na própria rota.
server {
    server_name DOMINIO;
    client_max_body_size 200m;
    # sem versão do nginx no cabeçalho Server (achado 10036 do ZAP baseline, item HARD-01)
    server_tokens off;
    # item L7-06-c: a linha de acesso do nginx vai para o journal com a tag `plat_nginx`, que é a
    # fonte "nginx" de app/logs_consulta.py::FONTES_PADRAO — sem isto `plat logs --req-id` nunca
    # mostra a linha do nginx. O formato plat_json está em deploy/nginx-log-formats.conf (contexto
    # http, instalado em /etc/nginx/conf.d/plat_log_formats.conf) e já sai com o caminho redigido:
    # o token de serviço vive no CAMINHO da URL e nunca pode cair em log em texto claro.
    # `nohostname` NÃO é detalhe: sem ele o nginx manda a linha RFC 3164 com o hostname antes da tag, o
    # journald não reconhece a tag como SYSLOG_IDENTIFIER e `journalctl -t plat_nginx` devolve ZERO
    # linha — que é exatamente o sintoma que o laudo do item registrou. Com `nohostname` a linha chega
    # como `plat_nginx[pid]: {json}` e a fonte passa a existir. Medido em 18/09/2026 nos dois sentidos.
    access_log syslog:server=unix:/dev/log,nohostname,tag=plat_nginx,severity=info plat_json;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP (achado 10038 do ZAP baseline, item HARD-01): a interface é uma página única servida de /static/ — só
    # módulos próprios; MapLibre cria worker por blob: (estilo via CSSOM, que o CSP não barra); imagem de mapa
    # (tile/miniatura) chega por data:/blob:; nada é carregado de outra origem (conexão externa passa pela API).
    # /api/docs (swagger) tem o seu bloco abaixo porque o script e o estilo de arranque dele são inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS só faz sentido no bloco 443: o install.sh apaga estas linhas quando ainda não há certificado
    add_header Strict-Transport-Security "max-age=31536000" always;

    # PMTiles (item L2-01-a): o navegador lê por Range HTTP (206) para não baixar o arquivo inteiro por
    # tile; `gzip off` é obrigatório aqui — nginx não manda Range em corpo comprimido on-the-fly, e o
    # PMTiles já vem com compressão interna por tile (regra já paga na casa, DOC.md/L2_CONCEITO C3).
    # Regex com captura (obrigatório com `alias`: sem grupo, TODA requisição que bate cai no mesmo
    # arquivo — armadilha clássica do nginx); casa antes do prefixo `/static/` genérico logo abaixo (a
    # regex vence um prefixo simples sem `^~`, regra de precedência do nginx).
    location ~* ^/static/dados/basemap/(?<arquivo_pmtiles>[^/]+\.pmtiles)$ {
        alias APP_DIR/web/dados/basemap/$arquivo_pmtiles;
        gzip off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
    # estático direto do disco; no-store nos módulos ES (nunca ?v= em import: duas URLs = duas instâncias)
    location /static/ {
        alias APP_DIR/web/;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
    # tiles vetoriais (itens L2-01-mapa-web / L2-01-b): dois caminhos possíveis, um contrato de URL só.
    # O que está ligado por padrão é o repasse pela própria plataforma (location / abaixo, rota
    # /tiles/... de app/mapa/rotas.py), porque é o caminho que a suíte prova de ponta a ponta e o que
    # funciona no appliance sem nginx. Para tirar o Python do caminho do tile sob carga, troque o
    # comentário abaixo: o nginx valida o token com auth_request em /internal/tiles/verificar (a MESMA
    # função de autorização, app/tiles/rotas.autorizar) e repassa direto ao Martin em 127.0.0.1:8151.
    #
    # location /tiles/ {
    #     auth_request /internal/tiles/verificar;
    #     auth_request_set $motivo $upstream_http_x_motivo_recusa;
    #     proxy_pass http://127.0.0.1:8151/;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
    # location = /internal/tiles/verificar {
    #     internal;
    #     proxy_pass http://127.0.0.1:PORTA;
    #     proxy_pass_request_body off;
    #     proxy_set_header Content-Length "";
    #     proxy_set_header X-Original-Uri $request_uri;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # login: 10 r/min por IP (burst 10, sem atraso) contra força bruta por IP; 429 é a resposta (ADR 0002 seção 6.2).
    # add_header dentro do bloco cancela os herdados: o conjunto inteiro é repetido (armadilha documentada do nginx)
    location = /api/login {
        limit_req zone=plat_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /api/login/2fa {
        limit_req zone=plat_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # /api/docs (swagger-ui, item L0-01): o script de arranque é inline, por isso o CSP daqui difere só em script-src
    location = /api/docs {
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # site público do inquilino (item L5-20): ÚNICO caminho em que o X-Robots-Tag NÃO é do nginx. O
    # `add_header` do nginx acrescenta e não substitui, então a linha herdada do bloco `server` mandaria
    # "noindex, nofollow" junto do "index, follow" da aplicação num site que o inquilino escolheu indexar.
    # Aqui quem decide é a aplicação (plat.site_publicado.indexavel); o resto dos cabeçalhos de segurança é
    # repetido igual, porque `add_header` dentro de um location cancela os herdados.
    location /s/ {
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    # ── COG por inquilino (item L1-01-d; ADR 20260908T1255) ───────────────────────────────────────────────────────
    # `/svc/<token de serviço>/cog/<slug>/<item>/<asset>_<sha8>.<ext>` entrega o objeto de imagem do balde
    # daquele inquilino pelo endpoint WEB do Garage (127.0.0.1:3902), que só serve leitura anônima — a API S3
    # (:3900) continua exigindo assinatura. O token vai no CAMINHO, não em cabeçalho nem em query: o GDAL do
    # TiTiler e do ArcGIS Pro seguem a URL crua por Range e não carregam cabeçalho nosso; uma URL assinada que
    # expira quebraria o mapa colado no web map (medido em 29/08). Quem autoriza é a aplicação, por auth_request:
    # o token tem de ser válido, vivo, e do MESMO inquilino do <slug> do caminho — sem isso o endpoint web do
    # Garage seria leitura anônima do balde inteiro.
    # `slice 1m` + `proxy_cache_lock` fazem o nginx pedir ao Garage fatias de 1 MiB alinhadas e cacheáveis: 20
    # pedidos simultâneos ao mesmo tile frio viram 1 MISS + 19 HIT (medido em 31/08, DOC seção 13). Sem `slice`,
    # cada Range do GDAL seria um MISS diferente.
    location ~ "^/svc/(?<cog_token>plat_[A-Za-z0-9_-]{20,128})/cog/(?<cog_slug>[a-z0-9][a-z0-9-]{1,38})/(?<cog_obj>[0-9A-Za-z][0-9A-Za-z_-]{0,63}/[a-z][a-z0-9_]{0,39}_[0-9a-f]{8}\.[a-z0-9]{1,8})$" {
        auth_request /_plat_cog_autorizar;
        proxy_pass http://127.0.0.1:3902/$cog_obj;
        proxy_http_version 1.1;
        proxy_set_header Host PREFIXO_BALDE$cog_slug.web.garage.localhost;
        proxy_set_header Connection "";
        slice 1m;
        proxy_set_header Range $slice_range;
        proxy_cache plat_cog;
        proxy_cache_key "plat_cog$cog_slug/$cog_obj$slice_range";
        proxy_cache_valid 200 206 14d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache $upstream_cache_status always;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, max-age=300" always;
        # item L7-03-e (uma origem só, e ela cobre TODAS as respostas desta rota). A resposta de 200
        # vem de montante e já traz Referrer-Policy/X-Content-Type-Options/Permissions-Policy; a de
        # 403 é gerada pelo PRÓPRIO nginx quando o `auth_request` recusa, e nessa não há montante
        # nenhum para trazê-los. Repetir `add_header` sozinho duplicaria o 200 (medido em 16/09 e de
        # novo em 18/09 em sistema.iagrointel.com: Referrer-Policy e X-Content-Type-Options duas
        # vezes, Permissions-Policy com DOIS valores, o do nginx mais fraco). Retirá-los sozinho
        # deixaria o 403 sem cabeçalho de segurança nenhum (medido em 18/09). A combinação abaixo —
        # esconder os de montante e declarar os do nginx — dá exatamente um valor nas duas respostas.
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Permissions-Policy;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ────────────────────── serviço TiTiler por inquilino (item L1-02-a; unidade plat-titiler :8152)
    # Só os caminhos que a fábrica do TiTiler publica sob `/svc/<token>/raster/<item>/` vêm para cá; o
    # resto (XYZ curto, tilejson.json, info.json, wmts) continua na aplicação, no bloco abaixo. Este
    # bloco tem de vir ANTES dele: o nginx usa a PRIMEIRA `location ~` que casa.
    # A autorização é a MESMA subrequisição do bloco de baixo (`/_plat_tile_autorizar`): o token no
    # caminho tem de estar vivo e ser do inquilino do item, senão nem chega ao TiTiler.
    location ~ "^/svc/(?<plat_tok>[A-Za-z0-9_-]+)/raster/(?<plat_item>[^/]+)/(?:tiles/|info|statistics|point/|WebMercatorQuad/tilejson\.json)" {
        set $plat_tipo raster;
        auth_request /_plat_tile_autorizar;
        proxy_cache plat_tiles;
        proxy_cache_key "titiler|$plat_item|$uri|$args";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 20s;
        proxy_cache_valid 200 204 30m;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        add_header X-Plat-Cache $upstream_cache_status always;
        proxy_pass http://127.0.0.1:8152;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # item L7-03-e (uma origem só, e ela cobre TODAS as respostas desta rota). A resposta de 200
        # vem de montante e já traz Referrer-Policy/X-Content-Type-Options/Permissions-Policy; a de
        # 403 é gerada pelo PRÓPRIO nginx quando o `auth_request` recusa, e nessa não há montante
        # nenhum para trazê-los. Repetir `add_header` sozinho duplicaria o 200 (medido em 16/09 e de
        # novo em 18/09 em sistema.iagrointel.com: Referrer-Policy e X-Content-Type-Options duas
        # vezes, Permissions-Policy com DOIS valores, o do nginx mais fraco). Retirá-los sozinho
        # deixaria o 403 sem cabeçalho de segurança nenhum (medido em 18/09). A combinação abaixo —
        # esconder os de montante e declarar os do nginx — dá exatamente um valor nas duas respostas.
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Permissions-Policy;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ------------------------------------------------------------------ ladrilho raster (item L1-02)
    # O token está no CAMINHO (decisão C6): a chave de cache é DELIBERADAMENTE sem o token, para que dois
    # tokens do mesmo inquilino compartilhem o mesmo ladrilho no disco. Quem separa um inquilino do outro
    # na chave é o `<item>`, que é um uuid do catálogo do inquilino. Como o token não entra na chave, o
    # `auth_request` abaixo é obrigatório: sem ele, revogar um token não tiraria do ar o que já está em
    # cache. A resposta da autorização também é cacheada, por 2 s — com os 2 s do cache em processo da
    # aplicação, o pior caso entre revogar e receber 403 é 4 s (o portão do item pede <= 5 s).
    location ~ ^/svc/(?<plat_tok>[A-Za-z0-9_-]+)/(?<plat_tipo>raster|mosaico)/(?<plat_item>[^/]+)/(?<plat_resto>.+)$ {
        auth_request /_plat_tile_autorizar;
        proxy_cache plat_cache_tiles;
        proxy_cache_key "$plat_tipo|$plat_item|$plat_resto|$args";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 20s;
        proxy_cache_valid 200 204 30m;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        add_header X-Plat-Cache $upstream_cache_status always;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # item L7-03-e (uma origem só, e ela cobre TODAS as respostas desta rota). A resposta de 200
        # vem de montante e já traz Referrer-Policy/X-Content-Type-Options/Permissions-Policy; a de
        # 403 é gerada pelo PRÓPRIO nginx quando o `auth_request` recusa, e nessa não há montante
        # nenhum para trazê-los. Repetir `add_header` sozinho duplicaria o 200 (medido em 16/09 e de
        # novo em 18/09 em sistema.iagrointel.com: Referrer-Policy e X-Content-Type-Options duas
        # vezes, Permissions-Policy com DOIS valores, o do nginx mais fraco). Retirá-los sozinho
        # deixaria o 403 sem cabeçalho de segurança nenhum (medido em 18/09). A combinação abaixo —
        # esconder os de montante e declarar os do nginx — dá exatamente um valor nas duas respostas.
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Permissions-Policy;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # Contrato 2 (VectorTileServer Esri), só o TILE (ordem z/y/x) — o mesmo tratamento de cache do
    # contrato 1; TileJSON/descritor/estilo/sprites/fontes/exportação caem no bloco geral "/" logo
    # abaixo (documentos pequenos, sem ganho de cache de disco; Cache-Control vem da aplicação).
    location ~ ^/svc/(?<plat_tok>[^/]+)/rest/services/(?<plat_item>[0-9a-fA-F-]+)/VectorTileServer/tile/(?<plat_resto>[0-9]+/[0-9]+/[0-9]+\.pbf)$ {
        auth_request /_plat_tile_vetor_autorizar;
        proxy_cache plat_tiles_vetor;
        proxy_cache_key "$plat_item|$plat_resto|esri";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 20s;
        proxy_cache_valid 200 204 5m;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        add_header X-Plat-Cache $upstream_cache_status always;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # item L7-03-e (uma origem só, e ela cobre TODAS as respostas desta rota). A resposta de 200
        # vem de montante e já traz Referrer-Policy/X-Content-Type-Options/Permissions-Policy; a de
        # 403 é gerada pelo PRÓPRIO nginx quando o `auth_request` recusa, e nessa não há montante
        # nenhum para trazê-los. Repetir `add_header` sozinho duplicaria o 200 (medido em 16/09 e de
        # novo em 18/09 em sistema.iagrointel.com: Referrer-Policy e X-Content-Type-Options duas
        # vezes, Permissions-Policy com DOIS valores, o do nginx mais fraco). Retirá-los sozinho
        # deixaria o 403 sem cabeçalho de segurança nenhum (medido em 18/09). A combinação abaixo —
        # esconder os de montante e declarar os do nginx — dá exatamente um valor nas duas respostas.
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Permissions-Policy;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /_plat_tile_vetor_autorizar {
        internal;
        proxy_pass http://127.0.0.1:PORTA/api/tiles/vetor/autorizar;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Plat-Token $plat_tok;
        proxy_set_header X-Plat-Item $plat_item;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # a aplicação põe `no-store` em TODA resposta (piso do middleware, ADR 0002 seção 5): sem
        # ignorar esse cabeçalho aqui, o nginx nunca guardaria a autorização e cada tile bateria na
        # aplicação de novo (mesmo achado, medido, do ladrilho raster: 425 tiles/s indo à aplicação
        # contra 12.751 com a autorização em cache).
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache plat_tiles_vetor_auth;
        proxy_cache_key "$plat_tok|$plat_item|$http_referer|$http_origin|$remote_addr";
        proxy_cache_valid 204 401 403 2s;
        proxy_cache_lock on;
    }
    # subrequisição de autorização do bloco acima: a aplicação lê o token e o slug de X-Original-URI e responde
    # 204 (segue) ou 403 (para). `internal` = nenhum cliente alcança esta rota direto pelo nginx.
    location = /_plat_cog_autorizar {
        internal;
        proxy_pass http://127.0.0.1:PORTA/api/arquivos/_cog/autorizar;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /_plat_tile_autorizar {
        internal;
        proxy_pass http://127.0.0.1:PORTA/api/tiles/autorizar;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Plat-Token $plat_tok;
        proxy_set_header X-Plat-Item $plat_item;
        proxy_set_header X-Plat-Tipo $plat_tipo;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # a aplicação põe `no-store` em TODA resposta (piso do middleware, ADR 0002): sem ignorar esse
        # cabeçalho aqui, o nginx não guardaria a autorização e cada ladrilho voltaria a bater na aplicação
        # (MEDIDO: 425 ladrilhos/s com a subrequisição indo à aplicação, contra 12.751 com ela em cache).
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache plat_tiles_auth;
        proxy_cache_key "$plat_tok|$plat_tipo|$plat_item|$http_referer|$http_origin|$remote_addr";
        proxy_cache_valid 204 403 2s;
        proxy_cache_lock on;
    }

    location / {
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
