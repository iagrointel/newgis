# plat — plataforma SIG em pilha aberta (FastAPI :PORTA). Interno. Análise / beta privado.
# Gerado pelo install.sh a partir de deploy/nginx.conf; as linhas "# managed by Certbot" são preservadas.
# Cache-Control tem UMA origem só (decisão T2): a APLICAÇÃO nas rotas proxiadas, o NGINX no /static/ (onde o nginx
# é a origem do corpo). Motivo: `add_header` do nginx ACRESCENTA, nunca substitui — com a linha aqui, toda resposta
# que a aplicação já declarava saía com dois Cache-Control (MEDIDO em /saude e /tarefas: "no-store" + "no-store,
# must-revalidate"), e uma resposta que precisa de cache (miniatura: `private, max-age=300`) sairia contradita, sem
# como o serviço opor-se. A aplicação garante o piso `no-store, must-revalidate` em toda resposta pelo middleware
# de app/auth/middleware.py; quem quiser outro valor declara na própria rota.
server {
    server_name DOMINIO;
    client_max_body_size 200m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS só faz sentido no bloco 443: o install.sh apaga estas linhas quando ainda não há certificado
    add_header Strict-Transport-Security "max-age=31536000" always;

    # PMTiles (item L2-01-a): o navegador lê por Range HTTP (206) para não baixar o arquivo inteiro por
    # tile; `gzip off` é obrigatório aqui — nginx não manda Range em corpo comprimido on-the-fly, e o
    # PMTiles já vem com compressão interna por tile (regra já paga na casa, DOC.md/L2_CONCEITO C3).
    # Regex com captura (obrigatório com `alias`: sem grupo, TODA requisição que bate cai no mesmo
    # arquivo — armadilha clássica do nginx); casa antes do prefixo `/static/` genérico logo abaixo (a
    # regex vence um prefixo simples sem `^~`, regra de precedência do nginx).
    location ~* ^/static/dados/basemap/(?<arquivo_pmtiles>[^/]+\.pmtiles)$ {
        alias APP_DIR/web/dados/basemap/$arquivo_pmtiles;
        gzip off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # estático direto do disco; no-store nos módulos ES (nunca ?v= em import: duas URLs = duas instâncias)
    location /static/ {
        alias APP_DIR/web/;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # login: 10 r/min por IP (burst 10, sem atraso) contra força bruta por IP; 429 é a resposta (ADR 0002 seção 6.2).
    # add_header dentro do bloco cancela os herdados: o conjunto inteiro é repetido (armadilha documentada do nginx)
    location = /api/login {
        limit_req zone=plat_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /api/login/2fa {
        limit_req zone=plat_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # ── COG por inquilino (item L1-01-d; ADR 20260908T1255) ───────────────────────────────────────────────────────
    # `/svc/<token de serviço>/cog/<slug>/<item>/<asset>_<sha8>.<ext>` entrega o objeto de imagem do balde
    # daquele inquilino pelo endpoint WEB do Garage (127.0.0.1:3902), que só serve leitura anônima — a API S3
    # (:3900) continua exigindo assinatura. O token vai no CAMINHO, não em cabeçalho nem em query: o GDAL do
    # TiTiler e do ArcGIS Pro seguem a URL crua por Range e não carregam cabeçalho nosso; uma URL assinada que
    # expira quebraria o mapa colado no web map (medido em 29/08). Quem autoriza é a aplicação, por auth_request:
    # o token tem de ser válido, vivo, e do MESMO inquilino do <slug> do caminho — sem isso o endpoint web do
    # Garage seria leitura anônima do balde inteiro.
    # `slice 1m` + `proxy_cache_lock` fazem o nginx pedir ao Garage fatias de 1 MiB alinhadas e cacheáveis: 20
    # pedidos simultâneos ao mesmo tile frio viram 1 MISS + 19 HIT (medido em 31/08, DOC seção 13). Sem `slice`,
    # cada Range do GDAL seria um MISS diferente.
    location ~ "^/svc/(?<cog_token>plat_[A-Za-z0-9_-]{20,128})/cog/(?<cog_slug>[a-z0-9][a-z0-9-]{1,38})/(?<cog_obj>[0-9A-Za-z][0-9A-Za-z_-]{0,63}/[a-z][a-z0-9_]{0,39}_[0-9a-f]{8}\.[a-z0-9]{1,8})$" {
        auth_request /_plat_cog_autorizar;
        proxy_pass http://127.0.0.1:3902/$cog_obj;
        proxy_http_version 1.1;
        proxy_set_header Host PREFIXO_BALDE$cog_slug.web.garage.localhost;
        proxy_set_header Connection "";
        slice 1m;
        proxy_set_header Range $slice_range;
        proxy_cache plat_cog;
        proxy_cache_key "plat_cog$cog_slug/$cog_obj$slice_range";
        proxy_cache_valid 200 206 14d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache $upstream_cache_status always;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, max-age=300" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ------------------------------------------------------------------ ladrilho raster (item L1-02)
    # O token está no CAMINHO (decisão C6): a chave de cache é DELIBERADAMENTE sem o token, para que dois
    # tokens do mesmo inquilino compartilhem o mesmo ladrilho no disco. Quem separa um inquilino do outro
    # na chave é o `<item>`, que é um uuid do catálogo do inquilino. Como o token não entra na chave, o
    # `auth_request` abaixo é obrigatório: sem ele, revogar um token não tiraria do ar o que já está em
    # cache. A resposta da autorização também é cacheada, por 2 s — com os 2 s do cache em processo da
    # aplicação, o pior caso entre revogar e receber 403 é 4 s (o portão do item pede <= 5 s).
    location ~ ^/svc/(?<plat_tok>[A-Za-z0-9_-]+)/(?<plat_tipo>raster|mosaico)/(?<plat_item>[^/]+)/(?<plat_resto>.+)$ {
        auth_request /_plat_tile_autorizar;
        proxy_cache plat_tiles;
        proxy_cache_key "$plat_tipo|$plat_item|$plat_resto|$args";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 20s;
        proxy_cache_valid 200 204 30m;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        add_header X-Plat-Cache $upstream_cache_status always;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # subrequisição de autorização do bloco acima: a aplicação lê o token e o slug de X-Original-URI e responde
    # 204 (segue) ou 403 (para). `internal` = nenhum cliente alcança esta rota direto pelo nginx.
    location = /_plat_cog_autorizar {
        internal;
        proxy_pass http://127.0.0.1:PORTA/api/arquivos/_cog/autorizar;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /_plat_tile_autorizar {
        internal;
        proxy_pass http://127.0.0.1:PORTA/api/tiles/autorizar;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Plat-Token $plat_tok;
        proxy_set_header X-Plat-Item $plat_item;
        proxy_set_header X-Plat-Tipo $plat_tipo;
        proxy_set_header X-Real-IP $remote_addr;
        # a aplicação põe `no-store` em TODA resposta (piso do middleware, ADR 0002): sem ignorar esse
        # cabeçalho aqui, o nginx não guardaria a autorização e cada ladrilho voltaria a bater na aplicação
        # (MEDIDO: 425 ladrilhos/s com a subrequisição indo à aplicação, contra 12.751 com ela em cache).
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache plat_tiles_auth;
        proxy_cache_key "$plat_tok|$plat_tipo|$plat_item|$http_referer|$http_origin|$remote_addr";
        proxy_cache_valid 204 403 2s;
        proxy_cache_lock on;
    }

    location / {
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
