# plat — plataforma SIG em pilha aberta (FastAPI :PORTA). Interno. Análise / beta privado.
# Gerado pelo install.sh a partir de deploy/nginx.conf; as linhas "# managed by Certbot" são preservadas.
# Cabeçalho de segurança tem UMA origem só, pela mesma razão do Cache-Control (item L7-03-e): nas rotas proxiadas
# quem declara Content-Security-Policy (com nonce por resposta e frame-ancestors por inquilino), Permissions-Policy,
# Cross-Origin-Opener-Policy, Cross-Origin-Resource-Policy, Referrer-Policy e X-Content-Type-Options é a APLICAÇÃO
# (app/cabecalhos.py); aqui ficam só os que dependem do transporte e do robô (Strict-Transport-Security, X-Robots-Tag).
# Em /static/ o nginx é a origem do corpo e declara o conjunto inteiro. X-Frame-Options sumiu das rotas proxiadas de
# propósito: quem manda no embutir passou a ser `frame-ancestors`, que aceita LISTA de origens por inquilino e tem
# precedência sobre o cabeçalho antigo nos navegadores atuais (docs/SEGURANCA.md).
# O perfil TLS (Mozilla intermediate), o HTTP/2 e o OCSP stapling ficam em deploy/nginx_tls.conf, que o install.sh
# escreve em /etc/nginx/conf.d/plat_tls.conf — contexto http, valem para o bloco 443 que o certbot gera.
# Cache-Control tem UMA origem só (decisão T2): a APLICAÇÃO nas rotas proxiadas, o NGINX no /static/ (onde o nginx
# é a origem do corpo). Motivo: `add_header` do nginx ACRESCENTA, nunca substitui — com a linha aqui, toda resposta
# que a aplicação já declarava saía com dois Cache-Control (MEDIDO em /saude e /tarefas: "no-store" + "no-store,
# must-revalidate"), e uma resposta que precisa de cache (miniatura: `private, max-age=300`) sairia contradita, sem
# como o serviço opor-se. A aplicação garante o piso `no-store, must-revalidate` em toda resposta pelo middleware
# de app/auth/middleware.py; quem quiser outro valor declara na própria rota.
server {
    server_name DOMINIO;
    client_max_body_size 200m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS só faz sentido no bloco 443: o install.sh apaga estas linhas quando ainda não há certificado
    add_header Strict-Transport-Security "max-age=31536000" always;

    # PMTiles (item L2-01-a): o navegador lê por Range HTTP (206) para não baixar o arquivo inteiro por
    # tile; `gzip off` é obrigatório aqui — nginx não manda Range em corpo comprimido on-the-fly, e o
    # PMTiles já vem com compressão interna por tile (regra já paga na casa, DOC.md/L2_CONCEITO C3).
    # Regex com captura (obrigatório com `alias`: sem grupo, TODA requisição que bate cai no mesmo
    # arquivo — armadilha clássica do nginx); casa antes do prefixo `/static/` genérico logo abaixo (a
    # regex vence um prefixo simples sem `^~`, regra de precedência do nginx).
    location ~* ^/static/dados/basemap/(?<arquivo_pmtiles>[^/]+\.pmtiles)$ {
        alias APP_DIR/web/dados/basemap/$arquivo_pmtiles;
        gzip off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
    # estático direto do disco; no-store nos módulos ES (nunca ?v= em import: duas URLs = duas instâncias)
    location /static/ {
        alias APP_DIR/web/;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
    # login: 10 r/min por IP (burst 10, sem atraso) contra força bruta por IP; 429 é a resposta (ADR 0002 seção 6.2).
    # add_header dentro do bloco cancela os herdados: o conjunto inteiro é repetido (armadilha documentada do nginx)
    location = /api/login {
        limit_req zone=plat_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nosniff, Referrer-Policy, CSP, Permissions-Policy e COOP/CORP vêm da aplicação (app/cabecalhos.py):
        # repeti-los aqui faria sair dois de cada, e o serviço perderia como dizer outra coisa numa rota.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /api/login/2fa {
        limit_req zone=plat_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nosniff, Referrer-Policy, CSP, Permissions-Policy e COOP/CORP vêm da aplicação (app/cabecalhos.py):
        # repeti-los aqui faria sair dois de cada, e o serviço perderia como dizer outra coisa numa rota.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location / {
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # nosniff, Referrer-Policy, CSP, Permissions-Policy e COOP/CORP vêm da aplicação (app/cabecalhos.py):
        # repeti-los aqui faria sair dois de cada, e o serviço perderia como dizer outra coisa numa rota.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
