# nginx do perfil `appliance` (item L7-01-a-compose-perfis). Adaptado de deploy/nginx.conf (o gerado pelo
# install.sh para a instalação hospedada): mesmos cabeçalhos de segurança e a mesma regra de Cache-Control
# de origem única (comentário longo em deploy/nginx.conf, não repetido aqui), trocando `proxy_pass
# http://127.0.0.1:PORTA` (mesma máquina, unidade systemd) por `proxy_pass http://api:8150` (nome do
# serviço Compose, rede interna do projeto — dentro do compose NÃO se usa network_mode: host para o
# nginx, ele é o único ponto de entrada de fora). Sem TLS/certbot aqui: quem operar o appliance como
# ponto exposto à internet decide o terminador de TLS por fora (fora do escopo deste item).
server {
    listen 80;
    client_max_body_size 200m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /static/ {
        alias /app/web/;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /saude {
        proxy_pass http://api:8150;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://api:8150;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
