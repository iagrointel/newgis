# plat — perfil TLS, HTTP/2 e OCSP stapling (item L7-03-e). Escrito pelo install.sh em
# /etc/nginx/conf.d/plat_tls.conf, contexto http: vale para o bloco 443 que o certbot gera, sem depender de
# editar as linhas "# managed by Certbot". DOMINIO é trocado pelo install.sh.
#
# Perfil: Mozilla SSL Configuration Generator, "intermediate" (guia Server Side TLS, versão 5.7), com UMA
# diferença declarada: a lista de cifras não traz as DHE-*. Sem DHE não é preciso gerar nem manter um
# ssl_dhparam, e nenhum cliente do alvo do perfil intermediate (Firefox 27+, Chrome 31+, Android 4.4+,
# OpenSSL 1.0.1+) depende delas — todos negociam ECDHE. O que fica de fora é cliente sem curva elíptica,
# que o perfil intermediate já não cobre.
#
# TLS 1.0 e 1.1 ficam de fora (o perfil intermediate os removeu em 2020); as suítes do TLS 1.3 não são
# configuráveis no nginx e são as três do RFC 8446.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
# no intermediate quem escolhe a cifra é o cliente (ele sabe o que tem aceleração no seu processador)
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:PlatTLS:10m;
# retomada por ticket exige chave rotacionada fora do processo; sem isso o ticket estraga o sigilo adiante
ssl_session_tickets off;

# OCSP stapling: o servidor carrega a resposta do respondedor da CA e a entrega no aperto de mão, poupando
# do navegador uma consulta que vaza o sítio visitado. `ssl_stapling_verify` exige a cadeia da CA, que o
# certbot deixa em chain.pem. O resolvedor é o do sistema (systemd-resolved); troque se a máquina usar outro.
ssl_stapling on;
ssl_stapling_verify on;
ssl_trusted_certificate /etc/letsencrypt/live/DOMINIO/chain.pem;
resolver 127.0.0.53 valid=300s ipv6=off;
resolver_timeout 5s;
