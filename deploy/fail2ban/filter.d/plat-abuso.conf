# fail2ban :: plat-abuso — camada 3 do item L7-03-b-rate-limit-abuso (docs/SEGURANCA.md §9.2).
# Lê SÓ /var/log/nginx/plat_access.log (deploy/nginx.conf, access_log dedicado do vhost do plat — nunca o
# access.log genérico da máquina, compartilhado com outros produtos). Formato "combined" padrão do nginx:
#   $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$referer" "$agente"
# <HOST> casa $remote_addr — o ENDEREÇO QUE O NGINX VIU NO SOCKET, nunca um cabeçalho. Isto é o que garante
# a cláusula "a restrição por IP não pode confiar em X-Forwarded-For forjado": mesmo que o cliente mande
# X-Forwarded-For com qualquer valor, o nginx nunca grava esse cabeçalho como $remote_addr nesta linha (só o
# faria com ngx_http_realip_module + set_real_ip_from apontando para o IP do cliente, o que este vhost não
# declara) — o endereço banido é sempre o do TCP peer.
#
# Bane por 401 (autenticação recusada — token/senha/escopo errados, força bruta) e 429 (as duas camadas de
# limite de taxa: nginx por IP e a API por inquilino) repetidos em /api/, /svc/ (tokens de ladrilho, quando
# a rota existir) e /tiles/.
[Definition]
# `\[\]` (colchetes vazios), não a data por extenso: o fail2ban CONSOME a data casada pelo `datepattern`
# abaixo antes de rodar o failregex (mesma convenção do filtro `nginx-botsearch` já instalado nesta
# máquina, `/etc/fail2ban/filter.d/nginx-botsearch.conf`) — escrever a data de novo aqui faz o failregex
# nunca casar (achado ao rodar `fail2ban-regex`: "Date template hits" positivo, "Failregex: 0 total").
failregex = ^<HOST> \S+ \S+ \[\] "(?:GET|POST|PUT|PATCH|DELETE|HEAD) (?:/api/|/svc/|/tiles/)\S*[^"]*" (?:401|429) \d+
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
