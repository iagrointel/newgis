# fail2ban :: jail "plat" — camada 3 do item L7-03-b-rate-limit-abuso (docs/SEGURANCA.md §9.2).
# backend=auto (arquivo), não o systemd do [DEFAULT] da casa (/etc/fail2ban/jail.local): o access_log do
# plat vai para um ARQUIVO dedicado (deploy/nginx.conf), nunca para o journal do nginx.service — usar o
# backend padrão da casa aqui faria esta jail nunca disparar (leria journal, onde a linha não existe).
# banaction/nftables herdado do [DEFAULT] da casa (não redeclarado; mesma ação que sshd/nginx-limit-req já usam).
[plat]
enabled  = true
backend  = auto
filter   = plat-abuso
logpath  = /var/log/nginx/plat_access.log
maxretry = 15
findtime = 120
bantime  = 3600
