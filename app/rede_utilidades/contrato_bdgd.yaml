  parametros: {car_inst_min: 300, fracao_min: 0.20, min_residenciais: 5}
  severidade: avisa
  justificativa: CAR_INST ≥ 300 (kW) em residência sugere W ou VA; ≥ 20 % das residenciais do trafo indica erro de unidade local. Ler com UCBT-10.
- id: F11
  camada: PIP
  nivel: transformador
  nome: IP — energia incompatível com a lâmpada
  parametros: {horas_dia_min: 6, horas_dia_max: 16, fracao_min: 0.50, min_pontos: 3, dias_mes: 30.42, unidade_pot_lamp: W, precondicao_mediana_concessao: true}
  severidade: avisa
  justificativa: >
    horas/dia implícitas = energia mensal ÷ (POT_LAMP em W ÷ 1000) ÷ 30,42; fora de 6–16 h/dia a potência declarada não fecha com a energia.
    Pré-condição: a mediana de horas/dia da concessão inteira tem de estar dentro de 6–16 h; se não estiver, a semântica de POT_LAMP/ENE da
    PIP é outra (unidade, energia estimada) e a regra fica NÃO AVALIADA em vez de marcar a concessão inteira.
  nota_calibracao: na concessão de calibração a energia de IP deriva da lâmpada (mediana 12,1 h/dia; 99 % em 12–15 h); na segunda distribuidora a mediana é 1,4 h/dia e 99,5 % dos pontos ficariam "fora".
