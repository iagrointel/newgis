[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["lento: e2e ou medição demorada; excluído do driver (pytest -m 'not lento')",
           "e2e: playwright contra a URL interna",
           "serial: muda o estado do inquilino de demonstração inteiro (cota, política, provedor de autenticação, suspensão, interruptor da semente); não pode correr ao lado de outro worker do pytest-xdist"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv", "web/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Body() em valor padrão é a forma do FastAPI; autenticado()/exigir() devolvem um Depends
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Query", "fastapi.Header",
                          "app.auth.sessao.autenticado", "app.auth.sessao.exigir"]
