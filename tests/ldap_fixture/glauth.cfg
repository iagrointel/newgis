# Diretório LDAP de teste (glauth) para o item L0-08-d-ldap. SÓ PARA TESTE: nunca usado em produção; dado
# sintético, sem nome de cliente (guardrail P7). Sobe em contêiner Docker efêmero (tests/ldap_fixture/subir.sh);
# a suíte (tests/api/ldap/conftest.py) inicia e para o contêiner por sessão de teste.
debug = false

[ldap]
  enabled = true
  listen = "0.0.0.0:3893"

[ldaps]
  enabled = false

[backend]
  datastore = "config"
  baseDN = "dc=plataforma-teste,dc=local"

[behaviors]
  IgnoreCapabilities = true
  LimitFailedBinds = false

