<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Redefinir senha · plat</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/estilo/tokens.css">
<link rel="stylesheet" href="/static/estilo/base.css">
<link rel="stylesheet" href="/static/estilo/componentes.css">
<script src="/static/js/base/tema.js"></script>
</head>
<body class="tela">
<main class="entrar" id="principal">
  <div class="cartao instrumento-moldura">
    <div class="marca"><strong data-i18n="app.nome">plat</strong> <span class="aviso-beta" data-i18n="app.beta">análise / beta privado</span></div>
    <h1 data-i18n="redefinir_senha.titulo">Redefinir senha</h1>
    <plat-aviso id="aviso"></plat-aviso>
    <form id="form-solicitar" class="form" novalidate hidden autocomplete="off">
      <p class="fraco" data-i18n="redefinir_senha.solicitar_ajuda">informe o inquilino e o e-mail cadastrado; se existir uma conta com esse e-mail, enviaremos um link</p>
      <div class="campo">
        <label for="inquilino" data-i18n="login.inquilino">inquilino</label>
        <input id="inquilino" name="inquilino" type="text" autocomplete="organization" autocapitalize="none" spellcheck="false" required maxlength="40">
      </div>
      <div class="campo">
        <label for="email" data-i18n="convite.email">e-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
      </div>
      <div class="botoes"><button type="submit" id="solicitar" class="primario" data-i18n="redefinir_senha.enviar_link">Enviar link</button></div>
    </form>
    <p id="solicitado" hidden data-i18n="redefinir_senha.solicitado">Se existir uma conta com esse e-mail, um link foi enviado. Confira sua caixa de entrada.</p>
    <form id="form-aplicar" class="form" novalidate hidden autocomplete="off">
      <div class="campo">
        <label for="senha" data-i18n="aceitar_convite.senha">escolha uma senha</label>
        <div class="linha-senha">
          <input id="senha" name="senha" type="password" autocomplete="new-password" required>
          <button type="button" id="mostrar-senha" class="pequeno" aria-pressed="false" aria-controls="senha" data-i18n="form.mostrar">mostrar</button>
        </div>
      </div>
      <div class="botoes"><button type="submit" id="aplicar" class="primario" data-i18n="redefinir_senha.trocar">Trocar senha</button></div>
    </form>
    <div id="concluido" hidden>
      <p data-i18n="redefinir_senha.concluido">Senha trocada. Você já pode entrar.</p>
      <a class="botao primario" href="/entrar" data-i18n="login.entrar">Entrar</a>
    </div>
  </div>
</main>
<script type="module" src="/static/js/auth/redefinir_senha.js"></script>
</body>
</html>
