<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Chamados · plat</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/estilo/tokens.css">
<link rel="stylesheet" href="/static/estilo/base.css">
<link rel="stylesheet" href="/static/estilo/componentes.css">
<link rel="stylesheet" href="/static/tarefas.css">
</head>
<body class="tela chamados">
<a class="pular" href="#principal">pular para o conteúdo</a>
<div class="app">
  <aside id="lateral" class="lateral"></aside>
  <main id="principal" class="principal" tabindex="-1">
    <div id="ferramentas" class="linha-ferramentas">
      <h1>Chamados</h1>
    </div>
    <p class="aviso-beta">análise / beta privado</p>
    <plat-aviso id="aviso"></plat-aviso>

    <section class="cartao" aria-labelledby="t-lista">
      <h2 id="t-lista">meus chamados <span id="lista-total" class="contagem">…</span></h2>
      <p class="ajuda">a primeira resposta do suporte tem prazo por severidade; o tempo medido aparece em cada
        linha quando o suporte já respondeu.</p>
      <plat-aviso id="lista-aviso"></plat-aviso>
      <div class="tabela-rolagem">
        <table id="lista" class="tabela">
          <caption class="sr-only">chamados do inquilino</caption>
          <thead>
            <tr>
              <th scope="col">nº</th>
              <th scope="col">título</th>
              <th scope="col">severidade</th>
              <th scope="col">estado</th>
              <th scope="col">primeira resposta</th>
              <th scope="col">aberto em</th>
              <th scope="col"><span class="sr-only">ações</span></th>
            </tr>
          </thead>
          <tbody id="lista-corpo"></tbody>
        </table>
      </div>
    </section>

    <plat-dialogo id="dialogo"></plat-dialogo>
  </main>
</div>
<script type="module" src="/static/js/chamados/chamados.js"></script>
</body>
</html>
