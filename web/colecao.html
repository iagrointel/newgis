<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coleção · plat</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/estilo/tokens.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/conteudo.css">
</head>
<body class="tela">
<a class="pular" href="#principal" data-i18n="app.pular">pular para o conteúdo</a>
<div class="app">
  <aside id="lateral" class="lateral"></aside>
  <main id="principal" class="principal" tabindex="-1">
    <h1 data-i18n="colecao.titulo">Coleção</h1>
    <p class="aviso-beta" data-i18n="app.beta">análise / beta privado</p>
    <plat-aviso id="aviso"></plat-aviso>
    <section id="leitor" class="cartao" hidden></section>
    <section id="compartilhar" class="cartao" hidden>
      <h2 data-i18n="colecao.compartilhar_titulo">publicar por link</h2>
      <p class="fraco" data-i18n="colecao.compartilhar_ajuda">o link expõe a coleção e os itens incluídos; o que fica de fora é avisado aqui</p>
      <plat-aviso id="aviso-link"></plat-aviso>
      <p><button id="botao-link" class="botao" data-i18n="colecao.link_gerar">gerar link</button></p>
      <div id="links"></div>
    </section>
  </main>
</div>
<script type="module" src="/static/js/colecao/tela.js"></script>
</body>
</html>
