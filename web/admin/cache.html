<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cache de ladrilhos · plat</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/estilo/tokens.css">
<link rel="stylesheet" href="/static/estilo/base.css">
<link rel="stylesheet" href="/static/estilo/componentes.css">
</head>
<body class="tela instrumento">
<a class="pular" href="#principal" data-i18n="app.pular">pular para o conteúdo</a>
<div class="app">
  <aside id="lateral" class="lateral"></aside>
  <main id="principal" class="principal" tabindex="-1">
    <h1 data-i18n="cache.titulo">Cache de ladrilhos</h1>
    <div class="linha-ferramentas" id="ferramentas"></div>
    <plat-aviso id="aviso"></plat-aviso>
    <section class="cartao" id="resumo" aria-labelledby="t-resumo">
      <h2 id="t-resumo" data-i18n="cache.resumo_titulo">Resumo</h2>
      <div id="resumo-corpo" class="fraco" data-i18n="cache.carregando">carregando…</div>
    </section>
    <section class="cartao" id="dias" aria-labelledby="t-dias">
      <h2 id="t-dias" data-i18n="cache.titulo">Cache de ladrilhos</h2>
      <plat-tabela id="tabela-dias" legenda="taxa de acerto do cache de ladrilhos por dia"></plat-tabela>
    </section>
    <p class="rodape-tela" data-i18n="cache.rodape">a fonte é o campo cache do log do nginx — um HIT nunca chega à aplicação; taxa desconhecida não é taxa zero</p>
  </main>
</div>
<script type="module" src="/static/js/admin/cache.js"></script>
</body>
</html>
