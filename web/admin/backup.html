<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Backup · plat</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/estilo/tokens.css">
<link rel="stylesheet" href="/static/estilo/base.css">
<link rel="stylesheet" href="/static/estilo/componentes.css">
</head>
<body class="tela instrumento">
<a class="pular" href="#principal" data-i18n="app.pular">pular para o conteúdo</a>
<div class="app">
  <aside id="lateral" class="lateral"></aside>
  <main id="principal" class="principal" tabindex="-1">
    <h1 data-i18n="backup.titulo">Backup</h1>
    <div class="linha-ferramentas" id="ferramentas"></div>
    <plat-aviso id="aviso"></plat-aviso>
    <section class="cartao" id="resumo" aria-labelledby="t-resumo">
      <h2 id="t-resumo" data-i18n="backup.resumo_titulo">Último ensaio de restauração</h2>
      <div id="resumo-corpo" class="fraco" data-i18n="backup.carregando">carregando…</div>
    </section>
    <section class="cartao" id="backups" aria-labelledby="t-backups">
      <h2 id="t-backups"><span data-i18n="backup.backups_titulo">Backups</span> <span id="backups-total" class="contagem"></span></h2>
      <plat-tabela id="tabela-backups" legenda="backups deste inquilino"></plat-tabela>
    </section>
    <section class="cartao" id="ensaios" aria-labelledby="t-ensaios">
      <h2 id="t-ensaios"><span data-i18n="backup.ensaios_titulo">Ensaios de restauração</span> <span id="ensaios-total" class="contagem"></span></h2>
      <plat-tabela id="tabela-ensaios" legenda="ensaios de restauração deste inquilino"></plat-tabela>
    </section>
    <p class="rodape-tela" data-i18n="backup.rodape">o dump é do schema deste inquilino; o ensaio restaura em schema temporário e o derruba ao final, mesmo quando reprova</p>
  </main>
</div>
<script type="module" src="/static/js/admin/backup.js"></script>
</body>
</html>
