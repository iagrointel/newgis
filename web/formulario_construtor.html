<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Construtor de formulário · plat</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/estilo/tokens.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/estilo/editor.css">
<style>
.formulario-construtor { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--e3); align-items: start; }
.formulario-paleta { background: var(--painel); border: 1px solid var(--borda); border-radius: var(--raio); padding: var(--e3); }
.formulario-chip { cursor: grab; padding: var(--e2); margin-bottom: var(--e2); border: 1px dashed var(--borda-forte); border-radius: var(--raio); }
.formulario-chip .tipo { color: var(--fraco); font-size: .75rem; }
.formulario-tela { display: grid; gap: var(--e3); min-height: 320px; }
.formulario-grupo-editor { background: var(--fundo-2); border: 1px solid var(--borda); border-radius: var(--raio); padding: var(--e3); min-height: 96px; }
.formulario-grupo-cabecalho { display: flex; justify-content: space-between; gap: var(--e2); margin-bottom: var(--e2); }
.formulario-grupo-corpo { display: grid; gap: var(--e2); min-height: 48px; }
.formulario-campo-editor { background: var(--painel); border: 1px solid var(--borda-forte); border-radius: var(--raio); padding: var(--e2) var(--e3); display: grid; gap: 4px; }
.formulario-campo-editor label { display: grid; gap: 2px; font-size: .8rem; color: var(--fraco); }
.formulario-campo-editor label.inline { display: flex; flex-direction: row; align-items: center; gap: var(--e2); }
.linha-arraste { cursor: grab; display: flex; justify-content: space-between; align-items: baseline; }
.formulario-status { color: var(--fraco); font-size: .85rem; }
.formulario-visita-dinamico .campo { margin-bottom: var(--e2); }
</style>
</head>
<body class="tela instrumento construtor formulario-construtor">
<a class="pular" href="#principal" data-i18n="app.pular">pular para o conteúdo</a>
<div class="app">
  <aside id="lateral" class="lateral"></aside>
  <main id="principal" class="principal" tabindex="-1">
    <h1>Construtor de formulário</h1>
    <plat-aviso id="aviso"></plat-aviso>
  </main>
</div>
<script type="module" src="/static/js/formulario/construtor.js"></script>
</body>
</html>
