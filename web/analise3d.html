<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Análise 3D · plat</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/estilo/tokens.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/tarefas.css">
</head>
<body class="tela analise3d">
<a class="pular" href="#principal">pular para o conteúdo</a>
<div class="app">
  <aside id="lateral" class="lateral"></aside>
  <main id="principal" class="principal" tabindex="-1">
    <div id="ferramentas" class="linha-ferramentas">
      <h1>Análise 3D</h1>
    </div>
    <p class="aviso-beta">análise / beta privado</p>
    <plat-aviso id="aviso"></plat-aviso>

    <section class="cartao" id="terreno-cartao" aria-labelledby="t-terreno">
      <h2 id="t-terreno">terreno de exemplo <span class="contagem" id="terreno-resumo">…</span></h2>
      <p class="ajuda">grade de elevação gerada nesta página (morro central e vale a oeste, célula de 20 m,
        SIRGAS 2000 UTM 23S). As quatro análises rodam sobre esta grade, enviada inline na requisição.</p>
      <div class="linha-ferramentas">
        <button type="button" id="bt-visada" class="primario">linha de visada</button>
        <button type="button" id="bt-viewshed">bacia visual (viewshed)</button>
        <button type="button" id="bt-perfil">perfil de elevação</button>
        <button type="button" id="bt-sombra">sombra projetada</button>
      </div>
    </section>

    <section class="cartao" id="saida-cartao" aria-labelledby="t-saida" hidden>
      <h2 id="t-saida">resultado <span class="contagem" id="saida-titulo"></span></h2>
      <plat-aviso id="saida-aviso"></plat-aviso>
      <div id="saida"></div>
    </section>
  </main>
</div>
<script type="module" src="/static/js/analise3d/painel.js"></script>
</body>
</html>
