<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tarefas · plat</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/tarefas.css">
</head>
<body class="tela tarefas">
<a class="pular" href="#principal">pular para o conteúdo</a>
<div class="app">
  <aside id="lateral" class="lateral"></aside>
  <main id="principal" class="principal" tabindex="-1">
    <h1>Tarefas</h1>
    <p class="aviso-beta">análise / beta privado · <span id="resumo-texto" class="resumo-texto">…</span></p>
    <plat-aviso id="aviso"></plat-aviso>

    <div class="tarefas-grade">
    <div class="tarefas-coluna">
    <section class="cartao" id="filtros-cartao" aria-labelledby="t-filtros">
      <h2 id="t-filtros">filtros</h2>
      <div class="filtros">
        <label>estado
          <select id="f-estado">
            <option value="">todos</option>
            <option value="pendente">pendente</option>
            <option value="rodando">rodando</option>
            <option value="concluido">concluído</option>
            <option value="falhou">falhou</option>
            <option value="cancelado">cancelado</option>
          </select>
        </label>
        <label>tipo
          <select id="f-tipo"><option value="">todos</option></select>
        </label>
        <label hidden>quem
          <select id="f-quem">
            <option value="eu">eu</option>
            <option value="todos">todos do inquilino</option>
          </select>
        </label>
        <label>período
          <select id="f-periodo">
            <option value="24h">últimas 24 h</option>
            <option value="7d" selected>últimos 7 dias</option>
            <option value="30d">últimos 30 dias</option>
            <option value="tudo">tudo</option>
          </select>
        </label>
        <button type="button" id="f-limpar" class="pequeno">limpar</button>
      </div>
    </section>

    <section class="cartao" id="lista-cartao" aria-labelledby="t-lista">
      <h2 id="t-lista">tarefas <span id="lista-total" class="contagem">…</span> <span id="lista-modo" class="marcador ok modo-lista"></span></h2>
      <plat-aviso id="lista-aviso"></plat-aviso>
      <div class="tabela-rolagem">
        <table id="lista" class="tabela">
          <caption class="sr-only">tarefas do inquilino</caption>
          <thead>
            <tr>
              <th scope="col" data-campo="estado" tabindex="0" aria-sort="none">estado</th>
              <th scope="col" data-campo="tipo" tabindex="0" aria-sort="none">tipo</th>
              <th scope="col">quem</th>
              <th scope="col" data-campo="criado_em" tabindex="0" aria-sort="descending">criado</th>
              <th scope="col" data-campo="iniciado_em" tabindex="0" aria-sort="none">duração</th>
              <th scope="col">progresso</th>
              <th scope="col"><span class="sr-only">ações</span></th>
            </tr>
          </thead>
          <tbody id="lista-corpo"></tbody>
        </table>
      </div>
      <div class="linha-ferramentas rodape-lista">
        <plat-paginacao id="paginacao"></plat-paginacao>
        <div class="direita"><button type="button" id="exportar-csv" class="pequeno">exportar CSV da página</button></div>
      </div>
    </section>

    <section class="cartao" id="agendas" aria-labelledby="t-agendas" hidden>
      <h2 id="t-agendas">agendas <span id="agendas-total" class="contagem">…</span></h2>
      <plat-aviso id="agendas-aviso"></plat-aviso>
      <div class="linha-ferramentas">
        <div class="direita"><button type="button" id="agenda-nova" class="pequeno primario">nova agenda</button></div>
      </div>
      <div id="agenda-form-caixa" class="agenda-form-caixa" hidden>
        <h3 id="agenda-form-titulo">nova agenda</h3>
        <plat-formulario id="agenda-form"></plat-formulario>
      </div>
      <plat-tabela id="agendas-tabela" legenda="agendas do inquilino"></plat-tabela>
    </section>
    </div>

    <section class="cartao detalhe" id="detalhe" aria-labelledby="t-detalhe" hidden>
      <div class="detalhe-cabecalho">
        <h2 id="t-detalhe"><span id="detalhe-tipo" class="mono">…</span> <span id="detalhe-estado" class="estado-job"></span> <span id="detalhe-modo" class="marcador ok" hidden></span></h2>
        <button type="button" id="detalhe-fechar" class="pequeno texto" aria-label="fechar detalhe">fechar</button>
      </div>
      <p id="detalhe-resumo" class="detalhe-resumo">…</p>
      <p id="detalhe-mensagem" class="detalhe-mensagem"></p>
      <p id="detalhe-erro" class="detalhe-erro" hidden></p>
      <p class="mono detalhe-id">id <span id="detalhe-id"></span></p>
      <plat-aviso id="detalhe-aviso"></plat-aviso>
      <div class="botoes">
        <button type="button" id="detalhe-cancelar" class="perigo" hidden>cancelar</button>
        <button type="button" id="detalhe-repetir" hidden>repetir</button>
        <button type="button" id="detalhe-baixar-log" disabled>baixar log</button>
      </div>
      <details open><summary>parâmetros</summary><pre id="detalhe-parametros">—</pre></details>
      <details open><summary>resultado</summary><pre id="detalhe-resultado">—</pre> <a id="detalhe-item" class="botao pequeno" href="#" hidden>abrir item</a></details>
      <details><summary>proveniência</summary><pre id="detalhe-proveniencia">—</pre></details>
      <details open class="log">
        <summary>log <span id="log-contagem" class="contagem"></span></summary>
        <div class="linha-ferramentas">
          <label class="campo-rotulo">nível
            <select id="log-nivel">
              <option value="DEBUG">todos</option>
              <option value="INFO" selected>INFO</option>
              <option value="AVISO">AVISO</option>
              <option value="ERRO">ERRO</option>
            </select>
          </label>
          <span id="log-nota" class="ajuda"></span>
        </div>
        <ol id="log-linhas" class="log-linhas" aria-live="polite"></ol>
      </details>
    </section>
    </div>
  </main>
</div>
<script type="module" src="/static/js/jobs/tarefas.js"></script>
</body>
</html>
