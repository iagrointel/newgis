<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>plat</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/estilo/tokens.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="tela instrumento inicio">
<a class="pular" href="#principal" data-i18n="app.pular">pular para o conteúdo</a>
<div class="app">
  <aside id="lateral" class="lateral"></aside>
  <main class="principal" id="principal" tabindex="-1">
    <header>
      <h1>plat</h1>
      <p class="aviso">análise / beta privado</p>
    </header>
    <section id="entrada" aria-label="entrada" hidden>
      <p id="entrada-texto"></p>
      <div class="passos-3" id="passos"></div>
      <div class="cartao" id="enviar-cartao">
        <h2 data-i18n="inicio.enviar_titulo">Envie</h2>
        <div id="enviar-area"></div>
      </div>
      <div class="cartao" id="recentes-cartao">
        <h2 data-i18n="inicio.recentes_titulo">Publicados recentemente</h2>
        <div id="recentes-lista"></div>
      </div>
      <nav class="linha-atalhos" id="atalhos" aria-label="atalhos"></nav>
    </section>
    <section id="versao" aria-label="versão">
      <dl>
        <dt>versão</dt><dd id="versao-numero">…</dd>
        <dt>git</dt><dd id="versao-git">…</dd>
        <dt>ambiente</dt><dd id="versao-ambiente">…</dd>
      </dl>
    </section>
    <section id="saude" aria-label="saúde">
      <h2>saúde <span id="saude-estado" class="estado">…</span></h2>
      <pre id="saude-json">…</pre>
    </section>
  </main>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
