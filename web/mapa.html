<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mapa · plat</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script src="/static/js/base/tema_cedo.js"></script>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/vendor/maplibre-gl-4.7.1.css">
<link rel="stylesheet" href="/static/mapa.css">
</head>
<body class="tela instrumento mapa">
<a class="pular" href="#mapa" data-i18n="app.pular">pular para o conteúdo</a>
<div class="app">
  <aside id="lateral" class="lateral"></aside>
  <main id="principal" class="principal mapa-tela" tabindex="-1">
    <div class="linha-ferramentas mapa-barra" id="ferramentas">
      <h1 data-i18n="mapa.titulo">Mapa</h1>
      <button type="button" id="tabela-alternar" class="secundario" aria-expanded="false"
              aria-controls="painel-tabela" data-i18n="tabela.alternar">tabela de atributos</button>
      <plat-aviso id="aviso"></plat-aviso>
    </div>
    <div class="mapa-corpo">
      <section class="mapa-painel-lateral" aria-label="painel do mapa">
        <form id="busca-form" class="bloco" role="search">
          <h2 data-i18n="mapa.busca">Pesquisar</h2>
          <label class="rotulo" for="busca-campo" data-i18n="mapa.busca_ajuda">endereço ou coordenada</label>
          <div class="linha">
            <input id="busca-campo" name="q" type="search" autocomplete="off"
                   data-i18n-aria="mapa.busca">
            <button type="submit" class="botao" data-i18n="mapa.ir">Ir</button>
          </div>
          <ul id="busca-sugestoes" class="sugestoes"></ul>
          <p id="busca-resultado" class="saida" aria-live="polite"></p>
        </form>

        <section class="bloco">
          <div class="arvore-cabecalho-bloco">
            <h2 data-i18n="mapa.camadas">Camadas</h2>
            <button type="button" id="btn-novo-grupo" class="botao-mini" aria-label="criar grupo">+ grupo</button>
          </div>
          <ul id="lista-camadas" class="lista-camadas arvore" role="tree" aria-label="Camadas"></ul>
          <h2 data-i18n="mapa.camadas">Camadas</h2>
          <ul id="lista-camadas" class="lista-camadas"></ul>
        </section>

        <section class="bloco">
          <h2 data-i18n="mapa.legenda">Legenda</h2>
          <div id="legenda" class="legenda"></div>
        </section>

        <section class="bloco">
          <h2 data-i18n="mapa.medicao">Medição</h2>
          <div class="linha">
            <button type="button" id="btn-distancia" class="botao" aria-pressed="false"
                    data-i18n="mapa.distancia">Distância</button>
            <button type="button" id="btn-area" class="botao" aria-pressed="false"
                    data-i18n="mapa.area">Área</button>
            <button type="button" id="btn-medicao-limpar" class="botao secundario"
                    data-i18n="mapa.limpar">Limpar</button>
          </div>
          <p id="medicao-saida" class="saida" aria-live="polite"></p>
        </section>

        <section class="bloco" id="bloco-desenho">
          <h2 data-i18n="mapa.desenho">Desenho</h2>
          <div class="linha desenho-ferramentas" role="group" aria-label="ferramentas de desenho">
            <button type="button" class="botao-mini" data-desenho="ponto" data-i18n="mapa.desenho_ponto">Ponto</button>
            <button type="button" class="botao-mini" data-desenho="linha" data-i18n="mapa.desenho_linha">Linha</button>
            <button type="button" class="botao-mini" data-desenho="poligono" data-i18n="mapa.desenho_poligono">Polígono</button>
            <button type="button" class="botao-mini" data-desenho="retangulo" data-i18n="mapa.desenho_retangulo">Retângulo</button>
            <button type="button" class="botao-mini" data-desenho="circulo" data-i18n="mapa.desenho_circulo">Círculo</button>
            <button type="button" class="botao-mini" data-desenho="texto" data-i18n="mapa.desenho_texto">Texto</button>
            <button type="button" class="botao-mini" data-desenho="seta" data-i18n="mapa.desenho_seta">Seta</button>
            <button type="button" id="btn-desenho-parar" class="botao-mini" data-i18n="mapa.desenho_parar">Parar</button>
            <button type="button" id="btn-desenho-editar-fim" class="botao-mini" data-i18n="mapa.desenho_editar_fim">Terminar edição</button>
          </div>
          <div class="linha desenho-estilo">
            <label for="desenho-cor" data-i18n="mapa.desenho_cor">cor</label>
            <input type="color" id="desenho-cor" value="#d98a2b">
            <label for="desenho-opacidade" data-i18n="mapa.desenho_opacidade">opacidade</label>
            <input type="range" id="desenho-opacidade" min="0" max="1" step="0.05" value="0.85">
            <label for="desenho-largura" data-i18n="mapa.desenho_largura">largura</label>
            <input type="number" id="desenho-largura" min="0" max="50" step="1" value="2">
            <label for="desenho-fonte" data-i18n="mapa.desenho_tamanho_fonte">tam. fonte</label>
            <input type="number" id="desenho-fonte" min="4" max="96" step="1" value="14">
            <label><input type="checkbox" id="desenho-snap"> <span data-i18n="mapa.desenho_snap">encaixar (10 px)</span></label>
          </div>
          <ul id="lista-desenho" class="lista-camadas" aria-label="feições desenhadas"></ul>
          <div class="linha">
            <button type="button" id="btn-desenho-limpar" class="botao secundario" data-i18n="mapa.desenho_limpar">Limpar tudo</button>
            <button type="button" id="btn-desenho-salvar" class="botao" data-i18n="mapa.desenho_salvar">Salvar no mapa</button>
            <button type="button" id="btn-desenho-promover" class="botao" data-i18n="mapa.desenho_promover">Promover a camada</button>
          </div>
          <div class="linha">
            <label for="desenho-importar" class="botao secundario" data-i18n="mapa.desenho_importar">Importar GeoJSON/KML</label>
            <input type="file" id="desenho-importar" accept=".geojson,.json,.kml" hidden>
          </div>
          <p id="desenho-saida" class="saida" aria-live="polite"></p>
        </section>

        <section class="bloco" id="bloco-anotacoes">
          <h2 data-i18n="mapa.anotacoes">Anotações</h2>
          <button type="button" id="btn-anotar" class="botao secundario" aria-pressed="false"
                  data-i18n="mapa.anotacao_modo">Clicar numa feição para anotar</button>
          <div id="anotacoes-corpo" hidden>
          <p id="anotacoes-alvo" class="saida"></p>
          <ul id="lista-anotacoes" class="lista-camadas" aria-label="anotações da feição"></ul>
          <label for="anotacao-grupo" data-i18n="mapa.anotacao_grupo">grupo</label>
          <select id="anotacao-grupo"></select>
          <label for="anotacao-texto" data-i18n="mapa.anotacao_texto">comentário</label>
          <textarea id="anotacao-texto" maxlength="4000" rows="2"></textarea>
          <button type="button" id="btn-anotacao-enviar" class="botao" data-i18n="mapa.anotacao_enviar">Comentar</button>
          </div>
        </section>

        <section class="bloco">
          <h2 data-i18n="mapa.impressao">Impressão</h2>
          <div class="linha">
            <button type="button" id="btn-png" class="botao">PNG</button>
            <button type="button" id="btn-pdf" class="botao">PDF</button>
          </div>
          <p id="impressao-saida" class="saida" aria-live="polite"></p>
        </section>
            <label class="rotulo" for="png-2x"><input type="checkbox" id="png-2x">
              <span data-i18n="mapa.impressao_2x">2x</span></label>
          </div>
          <p id="impressao-saida" class="saida" aria-live="polite"></p>
        </section>

        <section class="bloco">
          <h2 data-i18n="mapa.exportar_titulo">Exportar</h2>
          <div id="exportar" class="exportar"></div>
        </section>
      </section>

      <div class="mapa-area">
        <div id="mapa" aria-label="mapa" role="application"></div>
        <div class="mapa-painel mapa-painel-base">
          <label for="seletor-base" data-i18n="mapa.camada_base">camada base</label>
          <select id="seletor-base"></select>
        </div>
        <div class="mapa-painel mapa-coordenadas" id="coordenadas" aria-live="off">—</div>
        <div id="popup-dock" class="popup-dock" hidden aria-live="polite"></div>
      </div>
    </div>
    <section id="painel-tabela" class="mapa-tabela" aria-label="tabela de atributos" hidden>
      <div class="mapa-tabela-barra">
        <label for="tabela-camada" data-i18n="tabela.camada">camada</label>
        <select id="tabela-camada"></select>
        <label for="tabela-busca" data-i18n="tabela.busca">busca</label>
        <input type="search" id="tabela-busca" maxlength="200">
        <label><input type="checkbox" id="tabela-extensao">
          <span data-i18n="tabela.so_extensao">só na extensão do mapa</span></label>
        <label for="tabela-por-pagina" data-i18n="tabela.por_pagina">por página</label>
        <select id="tabela-por-pagina"></select>
        <button type="button" id="tabela-colunas-abrir" class="secundario" data-i18n="tabela.colunas">colunas</button>
        <button type="button" id="tabela-estatisticas-abrir" class="secundario"
                data-i18n="tabela.estatisticas">estatísticas</button>
        <button type="button" id="tabela-limpar" class="secundario" data-i18n="tabela.limpar">limpar seleção</button>
        <span id="tabela-selecao" class="mapa-tabela-info">—</span>
        <span id="tabela-contagem" class="mapa-tabela-info">—</span>
      </div>
      <div class="mapa-tabela-rolagem">
        <table class="mapa-tabela-grade">
          <thead><tr id="tabela-cabecalho"></tr></thead>
          <tbody id="tabela-corpo"></tbody>
        </table>
      </div>
      <div class="mapa-tabela-rodape">
        <button type="button" id="tabela-anterior" class="secundario" data-i18n="tabela.anterior">anterior</button>
        <span id="tabela-paginacao" class="mapa-tabela-info">—</span>
        <button type="button" id="tabela-proxima" class="secundario" data-i18n="tabela.proxima">próxima</button>
      </div>
      <div id="tabela-popup" class="mapa-tabela-caixa" hidden></div>
      <div id="tabela-colunas-painel" class="mapa-tabela-caixa" hidden></div>
      <div id="tabela-estatisticas-painel" class="mapa-tabela-caixa" hidden></div>
    </section>
  </main>
</div>
<script src="/static/vendor/maplibre-gl-4.7.1.js"></script>
<script src="/static/vendor/pmtiles-4.5.0.js"></script>
<script src="/static/vendor/terra-draw/terra-draw-1.33.0.js"></script>
<script src="/static/vendor/terra-draw/terra-draw-maplibre-gl-adapter-1.4.1.js"></script>
<script type="module" src="/static/js/mapa/mapa.js"></script>
</body>
</html>
