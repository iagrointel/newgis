<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mapa · plat</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/estilo/tokens.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/vendor/maplibre-gl-4.7.1.css">
<link rel="stylesheet" href="/static/mapa.css">
</head>
<body class="tela instrumento mapa">
<a class="pular" href="#mapa" data-i18n="app.pular">pular para o conteúdo</a>
<div class="app">
  <aside id="lateral" class="lateral"></aside>
  <main id="principal" class="principal mapa-tela" tabindex="-1">
    <div class="linha-ferramentas mapa-barra" id="ferramentas">
      <h1 data-i18n="mapa.titulo">Mapa</h1>
      <plat-aviso id="aviso"></plat-aviso>
    </div>
    <div class="mapa-corpo">
      <section class="mapa-painel-lateral" aria-label="painel do mapa">
        <form id="busca-form" class="bloco" role="search">
          <h2 data-i18n="mapa.busca">Pesquisar</h2>
          <label class="rotulo" for="busca-campo" data-i18n="mapa.busca_ajuda">endereço ou coordenada</label>
          <div class="linha">
            <input id="busca-campo" name="q" type="search" autocomplete="off"
                   data-i18n-aria="mapa.busca">
            <button type="submit" class="botao" data-i18n="mapa.ir">Ir</button>
          </div>
          <ul id="busca-sugestoes" class="sugestoes"></ul>
          <p id="busca-resultado" class="saida" aria-live="polite"></p>
        </form>

        <section class="bloco">
          <h2 data-i18n="mapa.camadas">Camadas</h2>
          <ul id="lista-camadas" class="lista-camadas"></ul>
        </section>

        <section class="bloco">
          <h2 data-i18n="mapa.legenda">Legenda</h2>
          <div id="legenda" class="legenda"></div>
        </section>

        <section class="bloco">
          <h2 data-i18n="mapa.medicao">Medição</h2>
          <div class="linha">
            <button type="button" id="btn-distancia" class="botao" aria-pressed="false"
                    data-i18n="mapa.distancia">Distância</button>
            <button type="button" id="btn-area" class="botao" aria-pressed="false"
                    data-i18n="mapa.area">Área</button>
            <button type="button" id="btn-medicao-limpar" class="botao secundario"
                    data-i18n="mapa.limpar">Limpar</button>
          </div>
          <p id="medicao-saida" class="saida" aria-live="polite"></p>
        </section>

        <section class="bloco">
          <h2 data-i18n="mapa.impressao">Impressão</h2>
          <div class="linha">
            <button type="button" id="btn-png" class="botao">PNG</button>
            <button type="button" id="btn-pdf" class="botao">PDF</button>
            <label class="rotulo" for="png-2x"><input type="checkbox" id="png-2x">
              <span data-i18n="mapa.impressao_2x">2x</span></label>
          </div>
          <p id="impressao-saida" class="saida" aria-live="polite"></p>
        </section>

        <section class="bloco">
          <h2 data-i18n="mapa.exportar_titulo">Exportar</h2>
          <div id="exportar" class="exportar"></div>
        </section>
      </section>

      <div class="mapa-area">
        <div id="mapa" aria-label="mapa" role="application"></div>
        <div class="mapa-painel mapa-painel-base">
          <label for="seletor-base" data-i18n="mapa.camada_base">camada base</label>
          <select id="seletor-base"></select>
        </div>
        <div class="mapa-painel mapa-coordenadas" id="coordenadas" aria-live="off">—</div>
      </div>
    </div>
  </main>
</div>
<script src="/static/vendor/maplibre-gl-4.7.1.js"></script>
<script src="/static/vendor/pmtiles-4.5.0.js"></script>
<script type="module" src="/static/js/mapa/mapa.js"></script>
</body>
</html>
