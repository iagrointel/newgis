<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Minha conta · plat</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script src="/static/js/base/tema_cedo.js"></script>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/vendor/dompurify-3.4.14.js"></script>
</head>
<body class="tela">
<a class="pular" href="#principal" data-i18n="app.pular">pular para o conteúdo</a>
<div class="app">
  <aside id="lateral" class="lateral"></aside>
  <main id="principal" class="principal" tabindex="-1">
    <h1 data-i18n="conta.titulo">Minha conta</h1>
    <div id="pendencia"></div>
    <section class="cartao" id="dados" aria-labelledby="t-dados">
      <h2 id="t-dados" data-i18n="conta.dados">Dados</h2>
      <div class="botoes">
        <img id="foto-preview" class="foto-perfil" alt="" width="96" height="96" hidden>
        <span id="foto-vazio" class="fraco" data-i18n="conta.foto_sem">sem foto</span>
        <label class="botao pequeno" for="foto-arquivo"><span data-i18n="conta.foto_enviar">Enviar foto</span>
          <input type="file" id="foto-arquivo" accept="image/png,image/jpeg,image/gif,image/webp" hidden></label>
        <button type="button" id="foto-remover" class="pequeno perigo" data-i18n="conta.foto_remover">Remover foto</button>
      </div>
      <p class="fraco" data-i18n="conta.foto_ajuda">PNG, JPEG, GIF ou WEBP, até 1 MB; a imagem é recortada num quadro de 200×200</p>
      <plat-formulario id="form-dados"></plat-formulario>
      <details class="espaco"><summary data-i18n="conta.privilegios">privilégios</summary><ul class="privilegios-lista espaco" id="lista-privilegios"></ul></details>
    </section>
    <section class="cartao" id="preferencias" aria-labelledby="t-preferencias">
      <h2 id="t-preferencias" data-i18n="conta.preferencias">Preferências</h2>
      <div class="campo"><span class="campo-rotulo" data-i18n="tema.rotulo">tema</span> <plat-tema id="tema"></plat-tema></div>
    </section>
    <section class="cartao" id="senha" aria-labelledby="t-senha">
      <h2 id="t-senha" data-i18n="conta.senha">Senha</h2>
      <plat-formulario id="form-senha"></plat-formulario>
    </section>
    <section class="cartao" id="2fa" aria-labelledby="t-2fa">
      <h2 id="t-2fa"><span data-i18n="conta.segundo_fator">Segundo fator</span> <span class="estado" id="estado-2fa"></span></h2>
      <p id="texto-2fa"></p>
      <div id="area-2fa"></div>
      <div class="botoes" id="botoes-2fa"></div>
    </section>
    <section class="cartao" id="sessoes" aria-labelledby="t-sessoes">
      <h2 id="t-sessoes" data-i18n="conta.sessoes">Sessões</h2>
      <plat-aviso id="aviso-sessoes"></plat-aviso>
      <plat-tabela id="tabela-sessoes" legenda="sessões ativas"></plat-tabela>
      <div class="botoes espaco"><button type="button" id="encerrar-outras" data-i18n="conta.encerrar_outras">Encerrar as outras</button></div>
    </section>
    <section class="cartao" id="convites" aria-labelledby="t-convites">
      <h2 id="t-convites" data-i18n="conta.convites">Convites</h2>
      <plat-aviso id="aviso-convites"></plat-aviso>
      <plat-tabela id="tabela-convites" legenda="convites pendentes"></plat-tabela>
    </section>
    <section class="cartao" id="tokens" aria-labelledby="t-tokens">
      <h2 id="t-tokens" data-i18n="conta.tokens">Tokens de serviço</h2>
      <p><a href="/admin/tokens" data-i18n="conta.ir_tokens">gerir os meus tokens de serviço</a></p>
    </section>
  </main>
</div>
<plat-dialogo id="dialogo"></plat-dialogo>
<script type="module" src="/static/js/auth/conta.js"></script>
</body>
</html>
